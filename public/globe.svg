<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main globe gradient -->
    <radialGradient id="globeGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner glow -->
    <radialGradient id="innerGlow" cx="45%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Edge highlight -->
    <radialGradient id="edgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent" stop-opacity="0"/>
      <stop offset="92%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Top highlight -->
    <radialGradient id="topHighlight" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Globe base -->
  <circle cx="400" cy="400" r="350" fill="url(#globeGrad)"/>
  <circle cx="400" cy="400" r="350" fill="url(#innerGlow)"/>
  <circle cx="400" cy="400" r="350" fill="url(#edgeGlow)"/>
  <circle cx="400" cy="400" r="350" fill="url(#topHighlight)"/>
  
  <!-- Grid lines (meridians) -->
  <ellipse cx="400" cy="400" rx="350" ry="350" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.1" fill="none"/>
  <ellipse cx="400" cy="400" rx="250" ry="350" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.08" fill="none"/>
  <ellipse cx="400" cy="400" rx="150" ry="350" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.08" fill="none"/>
  <ellipse cx="400" cy="400" rx="50" ry="350" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.06" fill="none"/>
  
  <!-- Grid lines (parallels) -->
  <ellipse cx="400" cy="400" rx="350" ry="350" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.1" fill="none"/>
  <ellipse cx="400" cy="250" rx="330" ry="60" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.06" fill="none"/>
  <ellipse cx="400" cy="320" rx="340" ry="40" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.07" fill="none"/>
  <ellipse cx="400" cy="400" rx="350" ry="30" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.08" fill="none"/>
  <ellipse cx="400" cy="480" rx="340" ry="40" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.07" fill="none"/>
  <ellipse cx="400" cy="550" rx="330" ry="60" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.06" fill="none"/>
  
  <!-- Continent-like shapes (abstract) -->
  <path d="M 300 200 C 320 190, 380 180, 400 200 C 420 220, 440 210, 450 230 C 460 250, 430 270, 400 260 C 370 250, 340 260, 320 240 C 300 220, 290 210, 300 200 Z" fill="#6366f1" fill-opacity="0.08"/>
  <path d="M 450 300 C 470 290, 520 310, 530 340 C 540 370, 520 400, 490 390 C 460 380, 440 350, 450 300 Z" fill="#6366f1" fill-opacity="0.06"/>
  <path d="M 280 350 C 300 340, 350 360, 340 390 C 330 420, 290 410, 280 380 C 270 360, 270 355, 280 350 Z" fill="#818cf8" fill-opacity="0.05"/>
  <path d="M 350 450 C 380 440, 430 460, 440 490 C 450 520, 420 540, 380 520 C 340 500, 330 470, 350 450 Z" fill="#6366f1" fill-opacity="0.07"/>
  
  <!-- Bright spots (cities) -->
  <circle cx="380" cy="220" r="2" fill="#a5b4fc" fill-opacity="0.4"/>
  <circle cx="470" cy="340" r="2" fill="#a5b4fc" fill-opacity="0.3"/>
  <circle cx="320" cy="370" r="1.5" fill="#a5b4fc" fill-opacity="0.3"/>
  <circle cx="400" cy="480" r="2" fill="#a5b4fc" fill-opacity="0.35"/>
  <circle cx="510" cy="350" r="1.5" fill="#a5b4fc" fill-opacity="0.25"/>
</svg>

